{% extends 'core/base.html' %}
{% load static %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="contenedor2 dataTables_wrapper">
  <div class="tituloFormulario" style="margin-bottom: 1.5rem;">
    <div class="tituloFormulario-texto">
      <i class="bi bi-grid"></i>
      <h2 class="sin-margen">{{ titulo }}</h2>
    </div>
    <div class="tituloFormulario-subrallado"></div>
  </div>

  <div class="mapa-acciones-superior" style="margin-bottom: 1rem;">
    <div class="dt-buttons mapa-botones-acciones">
      <button type="button" class="dt-button" title="Regresar a historiales" data-url="{% url 'mapeo_camas_historiales' %}" onclick="window.location.href=this.dataset.url">
        <i class="bi bi-arrow-left-circle boton-exportacion"></i>
      </button>
      <button type="button" class="dt-button" id="btn-copiar-detalle" title="Copiar resumen visible">
        <i class="bi bi-clipboard boton-exportacion"></i>
      </button>
      <button type="button" class="dt-button" id="btn-imprimir-detalle" title="Imprimir detalle">
        <i class="bi bi-printer boton-exportacion"></i>
      </button>
      <button type="button" class="dt-button active" id="btn-vista-estructura" title="Vista estructura">
        <i class="bi bi-grid boton-exportacion"></i>
      </button>
      <button type="button" class="dt-button" id="btn-vista-tabla" title="Vista tabla">
        <i class="bi bi-table boton-exportacion"></i>
      </button>
    </div>
    <div id="detalle-meta" class="detalle-meta"></div>
  </div>

  <div id="detalle-nota-servicios" class="detalle-nota-servicios" style="display:none;"></div>

  <div id="detalle-tabla-filtros" class="fechasfiltro" style="margin-bottom: 0.75rem;">
    <label for="dtf-fecha-inicio">Desde</label>
    <input type="date" id="dtf-fecha-inicio" class="formularioCampo-date">
    <label for="dtf-fecha-fin">Hasta</label>
    <input type="date" id="dtf-fecha-fin" class="formularioCampo-date">
    <button type="button" class="dt-button" id="dtf-btn-limpiar" title="Limpiar filtros">
      <i class="bi bi-eraser boton-exportacion"></i>
    </button>
  </div>

  <div id="detalle-estructura-contenedor" class="detalle-estructura"></div>
  <div id="detalle-cards-contenedor" class="historial-cards-grid"></div>

  <div id="detalle-tabla-contenedor" style="display:none;">
    <table id="tabla-detalle-camas" class="dataTable stripe hover row-border">
      <thead>
        <tr>
          <th>Cama</th>
          <th>Estado</th>
          <th>Paciente</th>
          <th>DNI</th>
          <th>Acción / Transición</th>
          <th>Fecha</th>
          <th>Usuario</th>
        </tr>
      </thead>
      <tbody id="tabla-detalle-camas-body"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'mapeo_camas/styles/historialesDetalleCamas.css' %}?v=20260508b">
{% endblock %}

{% block extra_js %}
<script src="{% static 'mapeo_camas/scripts/historialesDetalleCamas.js' %}?v=20260508b"></script>
{% endblock %}
