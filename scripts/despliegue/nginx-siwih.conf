# Nginx delante de Daphne.
#
# La diferencia con la configuracion que se usaba para Gunicorn son las dos
# cabeceras de Upgrade: sin ellas Nginx cierra la conexion cuando el navegador
# pide pasar a websocket, y el canal nunca se establece. Se dejan puestas
# desde ahora aunque todavia no haya websockets en uso, para que el dia que se
# agreguen no haya que tocar el servidor.
#
#   sudo cp scripts/despliegue/nginx-siwih.conf /etc/nginx/sites-available/siwih
#   sudo ln -s /etc/nginx/sites-available/siwih /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream siwih_asgi {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name SIWIH;

    # Las fotos de equipos viajan por el proxy de Django, no directas: una
    # peticion por fotografia y hasta 15 MB la subida desde el formulario.
    client_max_body_size 20M;

    location /static/ {
        alias /var/www/siwih_static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://siwih_asgi;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un websocket se queda abierto sin trafico durante minutos. Con el
        # valor por defecto (60s) Nginx lo cortaria por inactividad.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# $connection_upgrade vale "upgrade" solo cuando el navegador lo pide, y
# "close" en las peticiones normales. Va en /etc/nginx/nginx.conf, dentro del
# bloque http, porque un map no puede declararse dentro de un server:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
